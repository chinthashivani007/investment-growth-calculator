<!DOCTYPE html>
<html>
<head>
    <title>Investment Growth Calculator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            margin: 0;
            padding: 20px;
        }

        .calculator {
            max-width: 450px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            font-size: 26px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #1769aa;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d4f80;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef5ff;
            border-radius: 8px;
            text-align: center;
        }

        .amount {
            font-size: 24px;
            font-weight: bold;
            color: #1769aa;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Investment Growth Calculator</h1>

    <input type="number"
           id="investment"
           placeholder="Enter initial investment">

    <input type="number"
           id="rate"
           placeholder="Enter annual interest rate (%)">

    <input type="number"
           id="deposit"
           placeholder="Enter regular deposit">

    <input type="number"
           id="years"
           placeholder="Enter number of years">

    <button onclick="calculateInvestment()">
        Calculate Investment Growth
    </button>

    <div class="result">
        Final Investment Amount
        <div class="amount" id="result">₹0.00</div>
    </div>

</div>

<script>

function calculateInvestment() {

    let investment = Number(document.getElementById("investment").value);
    let rate = Number(document.getElementById("rate").value) / 100;
    let deposit = Number(document.getElementById("deposit").value);
    let years = Number(document.getElementById("years").value);

    let total = investment;

    for (let i = 1; i <= years; i++) {

        total = total * (1 + rate) + deposit;

    }

    document.getElementById("result").innerHTML =
        "₹" + total.toFixed(2);
}

</script>

</body>
</html>
